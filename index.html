<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Voicers - Voice Hospital Booking</title>
<style>
body{font-family:Arial;background:#f0f7ff;margin:0;padding:15px}
h1{color:#0b5ed7;text-align:center}
.card{background:white;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px #ccc}
button{background:#0b5ed7;color:white;border:none;padding:10px 15px;border-radius:8px;margin:5px 0;width:100%;font-size:16px}
button.green{background:#198754} button.red{background:#dc3545} button.grey{background:#6c757d}
select,input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
.slot{display:inline-block;padding:8px 12px;margin:4px;background:#e7f1ff;border-radius:20px;border:1px solid #0b5ed7}
.slot.sel{background:#0b5ed7;color:white}
.doc{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<h1>🏥 AI Voicers</h1>
<p style="text-align:center">Voice Hospital Booking - Bengaluru</p>

<div class="card">
<h2>🎤 Voice Booking</h2>
<button onclick="startVoice()">🎤 Tap & Speak - "Book Dr Priya tomorrow 10 AM"</button>
<p id="voiceText">Say your booking...</p>
</div>

<div class="card">
<h2>👨‍⚕️ 1. Doctor List</h2>
<div id="doctorList"></div>
</div>

<div class="card">
<h2>🏥 4. Hospital List</h2>
<div id="hospitalList"></div>
</div>

<div class="card">
<h2>📝 Book Appointment</h2>
<input id="pName" placeholder="Your Name">
<select id="dSelect"></select>
<input type="date" id="bDate">
<h3>2. Select Time Slot</h3>
<div id="slots"></div>
<p>Selected: <b id="selSlot">None</b></p>
<button class="green" onclick="book()">Confirm Booking ✅</button>
</div>

<div class="card">
<h2>📋 3. My Appointments</h2>
<div id="myApps">No appointments yet</div>
</div>

<script>
let doctors=[
{name:"Dr. Priya Sharma - General", hosp:"Apollo Hospital", fee:"₹500"},
{name:"Dr. Rahul Verma - Heart", hosp:"Fortis Hospital", fee:"₹800"},
{name:"Dr. Ananya Iyer - Child", hosp:"Manipal Hospital", fee:"₹600"},
{name:"Dr. Vikram Rao - Skin", hosp:"Columbia Asia", fee:"₹400"}
];
let hospitals=["Apollo Hospital - Bannerghatta","Fortis Hospital - Bannerghatta","Manipal Hospital - Old Airport Rd","Columbia Asia - Hebbal"];
let slots=["09:00 AM","10:00 AM","11:00 AM","12:00 PM","04:00 PM","05:00 PM","06:00 PM"];
let chosenSlot="";

let dl=document.getElementById('doctorList');
let ds=document.getElementById('dSelect');
doctors.forEach((d,i)=>{
 dl.innerHTML+=`<div class="doc"><div><b>${d.name}</b><br>${d.hosp} | ${d.fee}</div><button style="width:auto" onclick="selectDoc(${i})">Book</button></div><hr>`;
 ds.innerHTML+=`<option value="${i}">${d.name} - ${d.hosp}</option>`;
});
document.getElementById('hospitalList').innerHTML=hospitals.map(h=>`• ${h}<br>`).join('');

let sl=document.getElementById('slots');
slots.forEach(s=>{
 sl.innerHTML+=`<span class="slot" onclick="pickSlot(this,'${s}')">${s}</span>`;
});
function pickSlot(el,s){document.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');chosenSlot=s;document.getElementById('selSlot').innerText=s;}
function selectDoc(i){ds.value=i;window.scrollTo(0,400);}

function book(){
 let name=document.getElementById('pName').value||"Guest";
 let d=doctors[ds.value];
 let date=document.getElementById('bDate').value||"Tomorrow";
 if(!chosenSlot){alert("Please select time slot");return;}
 let apps=JSON.parse(localStorage.getItem('apps')||'[]');
 apps.push({name:name,doc:d.name,hosp:d.hosp,date:date,slot:chosenSlot});
 localStorage.setItem('apps',JSON.stringify(apps));
 alert("Voice understood! Now select slot & Confirm");
 showApps();
}
function showApps(){
 let apps=JSON.parse(localStorage.getItem('apps')||'[]');
 let div=document.getElementById('myApps');
 if(apps.length==0){div.innerHTML="No appointments yet";return;}
 div.innerHTML=apps.map((a,i)=>`<div class="card" style="background:#e7f1ff"><b>${a.doc}</b><br>${a.hosp}<br>${a.date} - ${a.slot}<br>Patient: ${a.name}<br><button class="red" onclick="cancelApp(${i})">5. Cancel ❌</button></div>`).join('');
}
function cancelApp(i){
 let apps=JSON.parse(localStorage.getItem('apps')||'[]');
 if(confirm("Cancel this appointment?")){apps.splice(i,1);localStorage.setItem('apps',JSON.stringify(apps));showApps();}
}
function startVoice(){
 let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
 r.lang='en-IN'; r.start();
 r.onresult=e=>{
  let t=e.results[0][0].transcript;
  document.getElementById('voiceText').innerText="You said: "+t;
  document.getElementById('pName').value="Guest";
  if(t.toLowerCase().includes("priya")) ds.value=0;
  if(t.toLowerCase().includes("rahul")) ds.value=1;
  if(t.toLowerCase().includes("ananya")) ds.value=2;
  if(t.toLowerCase().includes("vikram")) ds.value=3;
  if(t.includes("10")) pickSlot(document.querySelectorAll('.slot')[1],"10:00 AM");
  alert("Voice understood! Now select slot & Confirm");
 };
}
showApps();
</script>
</body>
</html>
