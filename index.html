<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b3c99">
  <title>ಜನಸೇವಾ Voice AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      display: grid;
      place-items: center;
      background: #eee7ff;
      color: #30254a;
      font-family: system-ui, "Noto Sans Kannada", sans-serif;
      font-size: 18px;
      line-height: 1.55;
    }

    .container {
      width: min(100%, 560px);
      padding: 24px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 35px rgba(100, 70, 150, .15);
    }

    .header { margin-bottom: 22px; text-align: center; }
    .icon { font-size: 48px; }
    h1 { margin: 5px 0 8px; color: #5b3c99; font-size: 29px; }
    .subtitle { color: #665c75; }

    label {
      display: block;
      margin: 17px 0 7px;
      color: #40364d;
      font-weight: 750;
    }

    textarea, input {
      width: 100%;
      padding: 13px;
      border: 2px solid #d8c9f5;
      border-radius: 11px;
      background: #fff;
      color: #241a12;
      font: inherit;
    }

    textarea { min-height: 125px; resize: vertical; }

    textarea:focus, input:focus, button:focus-visible {
      outline: 3px solid #9067d8;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled { opacity: .65; cursor: wait; }

    .voice-button {
      margin-top: 11px;
      background: #8b65d6;
      font-size: 20px;
    }

    .voice-button.listening {
      background: #b3261e;
      animation: pulse 1s infinite;
    }

    .submit-button { margin-top: 20px; background: #5b3c99; }
    .speak-button { margin-top: 10px; background: #6949a9; }

    @keyframes pulse {
      50% { transform: scale(1.02); }
    }

    #status {
      min-height: 30px;
      margin: 10px 0 0;
      color: #5b3c99;
      text-align: center;
    }

    .privacy-note {
      margin-top: 14px;
      padding: 11px;
      border-radius: 10px;
      background: #fff7e6;
      color: #584a31;
      font-size: 16px;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 17px;
      border-radius: 12px;
      background: #f1eaff;
      color: #4e347d;
      overflow-wrap: anywhere;
    }

    #result h2 { margin: 0 0 10px; font-size: 22px; }
    #result p { margin: 7px 0; }

    .footer {
      margin-top: 20px;
      color: #766d80;
      text-align: center;
      font-size: 15px;
    }

    @media (max-width: 420px) {
      body { padding: 10px; }
      .container { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="icon" aria-hidden="true">🏙️</div>
      <h1>ಜನಸೇವಾ Voice AI</h1>
      <p class="subtitle">ಸಾರ್ವಜನಿಕ ಸಮಸ್ಯೆಗಳನ್ನು ಧ್ವನಿಯ ಮೂಲಕ ತಿಳಿಸಿ</p>
    </header>

    <form id="complaintForm">
      <label for="complaint">ನಿಮ್ಮ ಸಮಸ್ಯೆಯನ್ನು ತಿಳಿಸಿ</label>
      <textarea
        id="complaint"
        placeholder="ಇಲ್ಲಿ ಬರೆಯಿರಿ ಅಥವಾ ಧ್ವನಿಯ ಮೂಲಕ ತಿಳಿಸಿ..."
        required
      ></textarea>

      <button id="voiceButton" type="button" class="voice-button">
        🎤 ಧ್ವನಿಯ ಮೂಲಕ ದೂರು ನೀಡಿ
      </button>
      <p id="status" role="status" aria-live="polite"></p>

      <label for="location">ಸಮಸ್ಯೆ ಇರುವ ಸ್ಥಳ</label>
      <input
        id="location"
        type="text"
        placeholder="ಊರು, ರಸ್ತೆ, ಪ್ರದೇಶ..."
        required
      >

      <button type="submit" class="submit-button">ದೂರು ಉಳಿಸಿ</button>
    </form>

    <section id="result" aria-live="polite">
      <h2>✅ ದೂರು ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ</h2>
      <p id="complaintId"></p>
      <p id="category"></p>
      <p id="complaintDetails"></p>
      <p id="locationDetails"></p>
      <p id="confirmation"></p>
      <button id="speakButton" class="speak-button" type="button">
        🔊 ದೃಢೀಕರಣ ಕೇಳಿ
      </button>
    </section>

    <p class="privacy-note">
      ನಿಮ್ಮ ದೂರು ಈ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತದೆ. ಇದು ಸರ್ಕಾರಿ ಕಚೇರಿಗೆ ಕಳುಹಿಸುವುದಿಲ್ಲ.
      ಇಲ್ಲಿ ತೋರಿಸುವ ಸಂಖ್ಯೆ ಸ್ಥಳೀಯ ಉಲ್ಲೇಖ ಸಂಖ್ಯೆ ಮಾತ್ರ.
    </p>

    <footer class="footer">ಸಾರ್ವಜನಿಕ ಸೇವೆ · ಜನರ ಧ್ವನಿ · ಉತ್ತಮ ನಗರ</footer>
  </main>

  <script>
    'use strict';

    const form = document.getElementById('complaintForm');
    const complaintInput = document.getElementById('complaint');
    const locationInput = document.getElementById('location');
    const voiceButton = document.getElementById('voiceButton');
    const statusText = document.getElementById('status');
    const result = document.getElementById('result');
    const speakButton = document.getElementById('speakButton');
    const STORAGE_KEY = 'janaseva_complaints_kn_v1';

    let recognition = null;
    let lastConfirmation = '';
    let kannadaVoice = null;

    function findKannadaVoice() {
      if (!('speechSynthesis' in window)) return null;

      const voices = window.speechSynthesis.getVoices();
      return voices.find(voice => /^kn-IN$/i.test(voice.lang)) ||
        voices.find(voice => /^kn(?:-|_|$)/i.test(voice.lang)) ||
        null;
    }

    function speakKannada(text) {
      if (!('speechSynthesis' in window) ||
          typeof SpeechSynthesisUtterance === 'undefined') {
        statusText.textContent = 'ಈ ಸಾಧನದಲ್ಲಿ ಧ್ವನಿ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ.';
        return;
      }

      window.speechSynthesis.cancel();
      kannadaVoice = findKannadaVoice();

      if (!kannadaVoice) {
        statusText.textContent = 'ಕನ್ನಡ ಧ್ವನಿ ಸಿಗಲಿಲ್ಲ. ಸಾಧನದಲ್ಲಿ ಕನ್ನಡ ಧ್ವನಿಯನ್ನು ಅಳವಡಿಸಿ.';
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'kn-IN';
      utterance.voice = kannadaVoice;
      utterance.rate = 0.88;
      utterance.pitch = 1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = findKannadaVoice;
      findKannadaVoice();
    }

    function startVoice() {
      const SpeechRecognitionAPI =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognitionAPI) {
        statusText.textContent =
          'ಈ ಸಾಧನದಲ್ಲಿ ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆ ಲಭ್ಯವಿಲ್ಲ. ಬರೆಯುವ ಮೂಲಕ ದೂರು ನೀಡಿ.';
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (_) { /* ಗುರುತಿಸುವಿಕೆ ನಿಂತಿದೆ */ }
      }

      recognition = new SpeechRecognitionAPI();
      recognition.lang = 'kn-IN';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        voiceButton.classList.add('listening');
        voiceButton.textContent = '🎧 ಕೇಳಲಾಗುತ್ತಿದೆ...';
        statusText.textContent = 'ನಿಮ್ಮ ಮಾತನ್ನು ಕೇಳಲಾಗುತ್ತಿದೆ...';
      };

      recognition.onresult = event => {
        const transcript = event.results?.[0]?.[0]?.transcript;

        if (transcript) {
          complaintInput.value = transcript;
          statusText.textContent = 'ನಿಮ್ಮ ಮಾತು ಗುರುತಿಸಲಾಗಿದೆ.';
          complaintInput.focus();
        } else {
          statusText.textContent = 'ಮಾತು ಕೇಳಿಸಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
        }
      };

      recognition.onerror = event => {
        const messages = {
          'not-allowed': 'ಮೈಕ್ರೊಫೋನ್ ಅನುಮತಿ ನೀಡಿ.',
          'audio-capture': 'ಮೈಕ್ರೊಫೋನ್ ಸಿಗಲಿಲ್ಲ.',
          'no-speech': 'ಮಾತು ಕೇಳಿಸಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.',
          'network': 'ಜಾಲದ ತೊಂದರೆ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.'
        };
        statusText.textContent =
          messages[event.error] || 'ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆಯಲ್ಲಿ ತೊಂದರೆ ಉಂಟಾಯಿತು.';
      };

      recognition.onend = () => {
        voiceButton.classList.remove('listening');
        voiceButton.textContent = '🎤 ಧ್ವನಿಯ ಮೂಲಕ ದೂರು ನೀಡಿ';
      };

      try {
        recognition.start();
      } catch (_) {
        statusText.textContent = 'ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆ ಪ್ರಾರಂಭವಾಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
      }
    }

    function detectCategory(text) {
      const value = text.toLowerCase();

      if (value.includes('ನೀರು')) return 'ನೀರಿನ ಸಮಸ್ಯೆ';
      if (value.includes('ರಸ್ತೆ') || value.includes('ಗುಂಡಿ')) return 'ರಸ್ತೆ ಸಮಸ್ಯೆ';
      if (value.includes('ವಿದ್ಯುತ್') || value.includes('ಕರೆಂಟ್')) return 'ವಿದ್ಯುತ್ ಸಮಸ್ಯೆ';
      if (value.includes('ಕಸ')) return 'ಕಸ ವಿಲೇವಾರಿ ಸಮಸ್ಯೆ';
      if (value.includes('ಚರಂಡಿ')) return 'ಚರಂಡಿ ಸಮಸ್ಯೆ';
      if (value.includes('ದೀಪ') || value.includes('ಲೈಟ್')) return 'ಬೀದಿ ದೀಪದ ಸಮಸ್ಯೆ';

      return 'ಇತರೆ ಸಾರ್ವಜನಿಕ ಸಮಸ್ಯೆ';
    }

    function readSavedComplaints() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch (_) {
        return [];
      }
    }

    function makeReferenceNumber() {
      const randomPart = Math.floor(100000 + Math.random() * 900000);
      return `ಸ್ಥಳೀಯ-${Date.now().toString().slice(-6)}-${randomPart}`;
    }

    voiceButton.addEventListener('click', startVoice);

    form.addEventListener('submit', event => {
      event.preventDefault();

      const complaintText = complaintInput.value.trim();
      const place = locationInput.value.trim();

      if (!complaintText || !place) {
        statusText.textContent = 'ದಯವಿಟ್ಟು ಸಮಸ್ಯೆ ಮತ್ತು ಸ್ಥಳವನ್ನು ತಿಳಿಸಿ.';
        return;
      }

      const entry = {
        reference: makeReferenceNumber(),
        category: detectCategory(complaintText),
        complaint: complaintText,
        location: place,
        createdAt: new Date().toISOString()
      };

      const savedComplaints = readSavedComplaints();
      savedComplaints.push(entry);

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedComplaints));
      } catch (_) {
        statusText.textContent =
          'ದೂರು ಉಳಿಸಲಾಗಲಿಲ್ಲ. ಸಾಧನದಲ್ಲಿ ಸಂಗ್ರಹ ಜಾಗ ಪರಿಶೀಲಿಸಿ.';
        return;
      }

      document.getElementById('complaintId').textContent =
        `ಸ್ಥಳೀಯ ಉಲ್ಲೇಖ ಸಂಖ್ಯೆ: ${entry.reference}`;
      document.getElementById('category').textContent =
        `ವಿಭಾಗ: ${entry.category}`;
      document.getElementById('complaintDetails').textContent =
        `ದೂರು: ${entry.complaint}`;
      document.getElementById('locationDetails').textContent =
        `ಸ್ಥಳ: ${entry.location}`;
      document.getElementById('confirmation').textContent =
        'ದೂರು ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ಇದು ಸರ್ಕಾರಿ ಕಚೇರಿಗೆ ಕಳುಹಿಸಲ್ಪಟ್ಟಿಲ್ಲ.';

      lastConfirmation =
        `ನಿಮ್ಮ ದೂರು ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ. ${entry.category}. ಸ್ಥಳೀಯ ಉಲ್ಲೇಖ ಸಂಖ್ಯೆ ${entry.reference}.`;

      result.style.display = 'block';
      statusText.textContent = 'ದೂರು ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.';
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    speakButton.addEventListener('click', () => {
      if (lastConfirmation) speakKannada(lastConfirmation);
    });

    window.addEventListener('pagehide', () => {
      if (recognition) {
        try { recognition.abort(); } catch (_) { /* ಮುಗಿದಿದೆ */ }
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });
  </script>
</body>
</html>
