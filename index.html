<!DOCTYPE html>
<html>
<head>
<title>AI Voicers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:black;color:white;font-family:Arial;text-align:center}
.top{padding:25px}
.top h1{font-size:34px;color:#C084FC;margin:0}
.card{background:#1A1A1A;margin:15px;padding:20px;border-radius:20px;text-align:left;border:1px solid #444}
.card h3{color:#C084FC}
.mic{width:110px;height:110px;border-radius:50%;border:none;background:#C084FC;font-size:50px}
</style>
</head>
<body>

<div class="top">
<h1>🎙️ AI Voicers</h1>
<p>No Typing, Only Speaking | Kannada or English</p>
<p>Say: <b>"Book appointment for fever tomorrow"</b></p>
<button class="mic" onclick="startVoice()">🎙️</button>
<p id="heard">Tap mic and speak...</p>
</div>

<div class="card">
<h3>✅ Appointment</h3>
<p id="appt">Speak to book...</p>
</div>

<div class="card">
<h3>💊 Medicine in Simple Kannada</h3>
<p id="med">Speak to get medicine...</p>
</div>

<div class="card">
<h3>⏰ Reminder</h3>
<p id="rem">Speak to set reminder...</p>
</div>

<script>
function startVoice(){
document.getElementById('heard').innerText="Listening...";
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='en-IN';
rec.onresult=(e)=>{
let text=e.results[0][0].transcript;
document.getElementById('heard').innerText="You said: "+text;
document.getElementById('appt').innerHTML="✅ Booked for Fever<br>Tomorrow, 10 AM<br>Raichur District Hospital<br>Token No: 12";
document.getElementById('med').innerHTML="💊 Paracetamol<br>Beligge 1 tablet oota aadmele<br>Sanje 1 tablet oota aadmele<br>Neeru jasti kudiyiri";
document.getElementById('rem').innerHTML="⏰ Reminder Set<br>Beligge 9 AM - 1 Tablet<br>Sanje 9 PM - 1 Tablet";
let msg=new SpeechSynthesisUtterance("Appointment booked tomorrow 10 AM Raichur hospital. Paracetamol beligge ondu, sanje ondu, oota aadmele tagoli. Reminder set 9 AM and 9 PM");
msg.lang='kn-IN';
speechSynthesis.speak(msg);
};
rec.start();
}
</script>
</body>
</html>
