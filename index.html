<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voicers - Doctor Booking</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f0f4ff;padding:15px}
h1{text-align:center;color:#4a00e0}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.doctor{display:flex;gap:12px;align-items:center}
.doctor img{width:70px;height:70px;border-radius:50%;object-fit:cover}
button{background:#6a00ff;color:white;border:none;padding:10px 15px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
.slot-btn{background:#eee;color:#333;padding:8px;border-radius:8px;border:1px solid #ddd;cursor:pointer;margin:3px}
.slot-btn.selected{background:#6a00ff;color:white}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 20px;border-radius:25px;display:none;z-index:999}
.top-btns{display:flex;gap:10px}
.top-btns button{width:50%}
</style>
</head>
<body>
<h1>🎤 AI Voicers</h1>
<p style="text-align:center">Book Doctor By Voice</p>

<div class="card">
<div class="top-btns">
<button onclick="startVoice()">🎤 Speak</button>
<button onclick="stopVoice()" style="background:#ff3b30">⏹ Stop</button>
</div>
<p id="voiceText" style="text-align:center">Tap Speak and say "Book Dr Rahul tomorrow 10 AM"</p>
</div>

<div class="card">
<h3>Book Appointment</h3>
<label>Doctor</label>
<select id="doctor">
<option value="Dr. Rahul Verma">Dr. Rahul Verma - Cardiologist</option>
<option value="Dr. Priya Sharma">Dr. Priya Sharma - Dentist</option>
<option value="Dr. Arjun Mehta">Dr. Arjun Mehta - General</option>
<option value="Dr. Sneha Iyer">Dr. Sneha Iyer - Pediatrician</option>
</select>
<label>Date</label>
<input type="date" id="date">
<label>Select Slot</label><br>
<div id="slots"></div>
<button onclick="book()">Confirm Booking ✅</button>
</div>

<div class="card">
<h3>📅 My Appointments</h3>
<div id="myAppts">No appointments yet</div>
</div>

<div id="toast"></div>

<script>
let chosenSlot="";
let slots=["09:00 AM","10:00 AM","11:00 AM","12:00 PM","04:00 PM","05:00 PM"];
let slotsDiv=document.getElementById("slots");
slots.forEach(s=>{
 let b=document.createElement("button");
 b.className="slot-btn"; b.innerText=s;
 b.onclick=()=>{chosenSlot=s; document.querySelectorAll(".slot-btn").forEach(x=>x.classList.remove("selected")); b.classList.add("selected");};
 slotsDiv.appendChild(b);
});
document.getElementById("date").valueAsDate=new Date();

function showToast(msg){
 let t=document.getElementById("toast");
 t.innerText=msg; t.style.display="block";
 setTimeout(()=>{t.style.display="none"},2500);
}

function book(){
 let d=document.getElementById("doctor").value;
 let date=document.getElementById("date").value;
 if(!chosenSlot){ showToast("Please select a slot"); return; }
 let list=JSON.parse(localStorage.getItem("appts")||"[]");
 list.push({doctor:d,date:date,slot:chosenSlot});
 localStorage.setItem("appts",JSON.stringify(list));
 showToast("Booked! "+d+" "+date+" "+chosenSlot);
 render();
}

function render(){
 let list=JSON.parse(localStorage.getItem("appts")||"[]");
 let div=document.getElementById("myAppts");
 if(list.length==0){div.innerHTML="No appointments yet"; return;}
 div.innerHTML=list.map((a,i)=>`<div style="border:1px solid #eee;padding:10px;border-radius:10px;margin-bottom:8px"><b>${a.doctor}</b><br>${a.date} at ${a.slot}<br><button onclick="cancelAppt(${i})" style="background:red;margin-top:5px">Cancel</button></div>`).join("");
}
function cancelAppt(i){
 let list=JSON.parse(localStorage.getItem("appts")||"[]");
 list.splice(i,1); localStorage.setItem("appts",JSON.stringify(list));
 showToast("Cancelled"); render();
}
render();

let rec;
function startVoice(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ showToast("Voice not supported in this browser"); return; }
 rec=new SR(); rec.lang="en-IN";
 rec.onresult=(e)=>{
  let txt=e.results[0][0].transcript;
  document.getElementById("voiceText").innerText="You said: "+txt;
  showToast("Got it! Now select slot & Confirm");
  if(txt.toLowerCase().includes("rahul")) document.getElementById("doctor").value="Dr. Rahul Verma";
  if(txt.toLowerCase().includes("priya")) document.getElementById("doctor").value="Dr. Priya Sharma";
  if(txt.toLowerCase().includes("arjun")) document.getElementById("doctor").value="Dr. Arjun Mehta";
  if(txt.toLowerCase().includes("sneha")) document.getElementById("doctor").value="Dr. Sneha Iyer";
 };
 rec.start();
 showToast("Listening... Speak now");
}
function stopVoice(){ if(rec) rec.stop(); showToast("Voice stopped"); }
</script>
</body>
</html>
