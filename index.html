<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voicers - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Poppins',Arial}
body{margin:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);min-height:100vh;padding:16px;padding-bottom:40px}
.top{color:white;text-align:center;padding:10px}
.top h1{font-size:34px;margin:0;font-weight:800;text-shadow:0 4px 20px rgba(0,0,0,0.2)}
.top p{opacity:0.9;font-size:15px;margin:6px 0}
.glass{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:28px;padding:22px;margin:14px 0;box-shadow:0 20px 40px rgba(0,0,0,0.15)}
.voice-btn{background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:white;border:none;width:100%;padding:26px;border-radius:20px;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 10px 25px rgba(255,107,107,0.4);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.stop-btn{background:#111;color:white;border:none;width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer}
#status{text-align:center;font-size:18px;font-weight:700;color:#6a00ff;margin:10px 0;min-height:26px}
#voiceText{text-align:center;font-size:16px;color:#333;background:#f8f9ff;padding:12px;border-radius:14px}
select,input{width:100%;padding:15px;margin:8px 0;border-radius:14px;border:2px solid #eee;font-size:16px;background:#f9f9ff;outline:none}
.doctor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.doc-card{background:linear-gradient(135deg,#f8f9ff,#fff);border:2px solid #eee;border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:0.2s}
.doc-card.active{border-color:#764ba2;background:linear-gradient(135deg,#e8e0ff,#fff);transform:scale(1.02);box-shadow:0 8px 20px rgba(118,75,162,0.2)}
.doc-card .emoji{font-size:36px}
.doc-card b{font-size:14px;display:block;margin-top:6px}
.doc-card span{font-size:12px;color:#888;display:block}
.doc-card .hosp{font-size:11px;color:#764ba2;font-weight:700;background:#f0eaff;padding:4px 8px;border-radius:20px;margin-top:6px;display:inline-block}
.appt{background:linear-gradient(135deg,#e8f5e9,#fff);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:16px 24px;border-radius:100px;display:none;z-index:999;font-size:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-width:90%}
.lang-row{display:flex;gap:10px}
.lang-row button{flex:1;padding:12px;border-radius:12px;border:2px solid #eee;background:white;font-weight:700;cursor:pointer}
.lang-row button.active{background:#111;color:white}
.hosp-filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.hosp-filter button{padding:8px 14px;border-radius:20px;border:2px solid #eee;background:white;font-size:13px;font-weight:600;cursor:pointer}
.hosp-filter button.active{background:#764ba2;color:white;border-color:#764ba2}
</style>
</head>
<body>
<div class="top">
<h1>✨ AI Voicers</h1>
<p>ಹಿರಿಯರಿಗಾಗಿ • Just Speak, Auto Book • Famous Hospitals</p>
</div>

<div class="glass">
<div class="lang-row">
<button id="btnKn" class="active" onclick="setLang('kn')">ಕನ್ನಡ</button>
<button id="btnEn" onclick="setLang('en')">English</button>
<button id="btnHi" onclick="setLang('hi')">हिन्दी</button>
</div>
<p id="status">🟢 Ready - Tap & Speak</p>
<button class="voice-btn" onclick="startVoice()">🎤 ಮಾತನಾಡಿ / SPEAK</button>
<p id="voiceText">Eg: "Navodaya hospital Rahul doctor naale 10 gante"<br>or "RIMS hospital Priya doctor tomorrow 11 AM"</p>
<button class="stop-btn" onclick="stopVoice()">⏹ STOP</button>
</div>

<div class="glass">
<h2 style="margin:0;text-align:center">🏥 Famous Hospitals + Doctor</h2>
<div class="hosp-filter" id="hospFilter"></div>
<div class="doctor-grid" id="docGrid"></div>
<div style="display:flex;gap:10px;margin-top:12px">
<div style="flex:1"><label>Date</label><input type="date" id="date"></div>
<div style="flex:1"><label>Time</label><select id="time"><option>09:00 AM</option><option selected>10:00 AM</option><option>11:00 AM</option><option>12:00 PM</option><option>04:00 PM</option><option>05:00 PM</option><option>06:00 PM</option></select></div>
</div>
<p style="text-align:center;color:#888;font-size:13px">No Confirm needed - Voice Auto-Books!</p>
</div>

<div class="glass">
<h3 style="margin:0">📅 My Appointments</h3>
<div id="myAppts" style="margin-top:12px">No appointments yet</div>
</div>
<div id="toast"></div>

<script>
const DOCTORS=[
 {name:"Dr. Rahul Verma",short:"rahul",special:"Heart ❤️",emoji:"👨‍⚕️",kn:"ರಾಹುಲ್",hospital:"Navodaya Hospital",hospShort:"navodaya"},
 {name:"Dr. Priya Sharma",short:"priya",special:"Teeth 🦷",emoji:"👩‍⚕️",kn:"ಪ್ರಿಯಾ",hospital:"RIMS Hospital",hospShort:"rims"},
 {name:"Dr. Arjun Mehta",short:"arjun",special:"General 🩺",emoji:"👨‍⚕️",kn:"ಅರ್ಜುನ್",hospital:"Navodaya Hospital",hospShort:"navodaya"},
 {name:"Dr. Sneha Iyer",short:"sneha",special:"Children 👶",emoji:"👩‍⚕️",kn:"ಸ್ನೇಹ",hospital:"RIMS Hospital",hospShort:"rims"},
 {name:"Dr. Ananya Rao",short:"ananya",special:"Skin ✨",emoji:"👩‍⚕️",kn:"ಅನನ್ಯ",hospital:"Manipal Hospital",hospShort:"manipal"},
 {name:"Dr. Vikram Gowda",short:"vikram",special:"Bones 🦴",emoji:"👨‍⚕️",kn:"ವಿಕ್ರಂ",hospital:"Apollo Hospital",hospShort:"apollo"},
 {name:"Dr. Kavitha Nair",short:"kavitha",special:"Women 🌸",emoji:"👩‍⚕️",kn:"ಕವಿತಾ",hospital:"Fortis Hospital",hospShort:"fortis"},
 {name:"Dr. Manjunath S",short:"manjunath",special:"Eye 👁️",emoji:"👨‍⚕️",kn:"ಮಂಜುನಾಥ್",hospital:"Narayana Hospital",hospShort:"narayana"},
 {name:"Dr. Shreya Patil",short:"shreya",special:"Fever 🤒",emoji:"👩‍⚕️",kn:"ಶ್ರೇಯಾ",hospital:"Navodaya Hospital",hospShort:"navodaya"},
 {name:"Dr. Kiran Kumar",short:"kiran",special:"Diabetes 🩸",emoji:"👨‍⚕️",kn:"ಕಿರಣ್",hospital:"RIMS Hospital",hospShort:"rims"},
 {name:"Dr. Divya Reddy",short:"divya",special:"Pregnancy 🤰",emoji:"👩‍⚕️",kn:"ದಿವ್ಯಾ",hospital:"Cloudnine Hospital",hospShort:"cloudnine"},
 {name:"Dr. Santosh Hegde",short:"santosh",special:"Brain 🧠",emoji:"👨‍⚕️",kn:"ಸಂತೋಷ್",hospital:"Manipal Hospital",hospShort:"manipal"},
];
let selectedDoctor=DOCTORS[0].name;
let selectedHospital="All";
let curLang='kn';
document.getElementById("date").valueAsDate=new Date();
function setLang(l){curLang=l;document.querySelectorAll('.lang-row button').forEach(b=>b.classList.remove('active'));if(l=='kn')document.getElementById('btnKn').classList.add('active');if(l=='en')document.getElementById('btnEn').classList.add('active');if(l=='hi')document.getElementById('btnHi').classList.add('active');}
function renderHospFilter(){
 let hosps=["All",...new Set(DOCTORS.map(d=>d.hospital))];
 document.getElementById("hospFilter").innerHTML=hosps.map(h=>`<button class="${selectedHospital==h?'active':''}" onclick="filterHosp('${h}')">${h.replace(' Hospital','')}</button>`).join("");
}
function filterHosp(h){selectedHospital=h;renderHospFilter();renderDoctors();}
function renderDoctors(){
 let list=selectedHospital=="All"?DOCTORS:DOCTORS.filter(d=>d.hospital==selectedHospital);
 document.getElementById("docGrid").innerHTML=list.map(d=>`<div class="doc-card ${selectedDoctor==d.name?'active':''}" onclick="selectDoctor('${d.name}')"><div class="emoji">${d.emoji}</div><b>${d.name.replace('Dr. ','')}</b><span>${d.special}</span><span class="hosp">🏥 ${d.hospital}</span></div>`).join("");
}
function selectDoctor(n){selectedDoctor=n;renderDoctors();}
renderHospFilter();renderDoctors();
function showToast(m){let t=document.getElementById("toast");t.innerText=m;t.style.display="block";setTimeout(()=>t.style.display="none",4000);}
function speakBack(msg){try{let u=new SpeechSynthesisUtterance(msg);u.lang="kn-IN";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
function getSelectedDoc(){return DOCTORS.find(d=>d.name==selectedDoctor);}
function autoBook(){
 let date=document.getElementById("date").value;
 let time=document.getElementById("time").value;
 let doc=getSelectedDoc();
 let list=JSON.parse(localStorage.getItem("appts")||"[]");
 list.push({doctor:selectedDoctor,hospital:doc.hospital,date:date,slot:time});
 localStorage.setItem("appts",JSON.stringify(list));
 showToast("✅ Booked! "+selectedDoctor+" at "+doc.hospital);
 document.getElementById("status").innerText="✅ BOOKED! "+selectedDoctor+" @ "+doc.hospital;
 speakBack("Book aayitu. "+selectedDoctor+" "+doc.hospital+" "+date+" "+time);
 render();
}
function render(){
 let list=JSON.parse(localStorage.getItem("appts")||"[]");
 let div=document.getElementById("myAppts");
 if(list.length==0){div.innerHTML="<p style='color:#888'>No appointments yet</p>";return;}
 div.innerHTML=list.map((a,i)=>`<div class="appt"><div><b>${a.doctor}</b><br><span style="color:#764ba2;font-weight:600">🏥 ${a.hospital}</span><br><span style="color:#666">${a.date} • ${a.slot}</span></div><button onclick="cancelAppt(${i})" style="background:#ff3b30;color:white;border:none;padding:8px 14px;border-radius:10px">Cancel</button></div>`).join("");
}
function cancelAppt(i){let l=JSON.parse(localStorage.getItem("appts")||"[]");l.splice(i,1);localStorage.setItem("appts",JSON.stringify(l));showToast("Cancelled");render();}
render();
let rec;
function startVoice(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){showToast("Use Chrome");return;}
 rec=new SR();rec.lang=curLang=='kn'?"kn-IN":curLang=='hi'?"hi-IN":"en-IN";
 document.getElementById("status").innerText="🎤 Listening...";
 rec.onresult=(e)=>{let txt=e.results[0][0].transcript;document.getElementById("voiceText").innerText="You said: "+txt;handleVoice(txt);};
 rec.start();showToast("Listening...");
}
function handleVoice(txt){
 let low=txt.toLowerCase();
 let found=null;
 DOCTORS.forEach(d=>{if(low.includes(d.short)||low.includes(d.kn)) found=d;});
 let hospFound=null;
 DOCTORS.forEach(d=>{if(low.includes(d.hospShort)) hospFound=d.hospital;});
 if(hospFound){selectedHospital=hospFound;renderHospFilter();}
 if(found){selectedDoctor=found.name;selectedHospital=found.hospital;renderHospFilter();renderDoctors();}
 else if(hospFound){let first=DOCTORS.find(d=>d.hospital==hospFound);selectedDoctor=first.name;renderDoctors();}
 if(low.includes("heart")||low.includes("ಹೃದಯ")){selectedDoctor="Dr. Rahul Verma";renderDoctors();}
 if(low.includes("teeth")||low.includes("ಹಲ್ಲು")){selectedDoctor="Dr. Priya Sharma";renderDoctors();}
 if(low.includes("skin")){selectedDoctor="Dr. Ananya Rao";renderDoctors();}
 if(low.includes("eye")||low.includes("ಕಣ್ಣು")){selectedDoctor="Dr. Manjunath S";renderDoctors();}
 let d=new Date();
 if(low.includes("naale")||low.includes("ನಾಳೆ")||low.includes("tomorrow")){d.setDate(d.getDate()+1);}
 else if(low.includes("nadu")||low.includes("ನಾಡಿದ್ದು")){d.setDate(d.getDate()+2);}
 document.getElementById("date").valueAsDate=d;
 if(low.includes("9")) document.getElementById("time").value="09:00 AM";
 if(low.includes("10")) document.getElementById("time").value="10:00 AM";
 if(low.includes("11")) document.getElementById("time").value="11:00 AM";
 if(low.includes("12")) document.getElementById("time").value="12:00 PM";
 if(low.includes("4")) document.getElementById("time").value="04:00 PM";
 if(low.includes("5")) document.getElementById("time").value="05:00 PM";
 if(low.includes("6")) document.getElementById("time").value="06:00 PM";
 if(found||hospFound||low.includes("book")||low.includes("maadi")||low.includes("ಬೇಕು")||low.includes("doctor")||low.includes("hospital")){autoBook();}
}
function stopVoice(){if(rec)rec.stop();showToast("Stopped");}
</script>
</body>
</html>
