<!DOCTYPE html>
<html><body style="text-align:center;padding:40px;font-family:Arial">
<h2>Kannada Voice - Final Test</h2>

<p id="msg" style="margin-top:15px"></p>

  responsiveVoice.speak("Nimma dooru book aagide. Nimma dooru sankhye R C R 4521. Purasabhege hogide. Eradu dinadalli sari maadtaare.", "Kannada Female", {rate: 0.9, onend: function(){ document.getElementById('msg').innerText = "Voice mugithu - Kelisidya?"; }});
}
</script>
